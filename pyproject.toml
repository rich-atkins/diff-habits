[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-habits"
version = "0.1.0"
description = "Measure code duplication and error-masking constructs from your own diff history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Richard Atkins" }]
keywords = ["git", "code-quality", "duplication", "technical-debt", "maintainability"]
dependencies = ["git-habits>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
diff-habits = "diff_habits.cli:main"

[project.urls]
Homepage = "https://github.com/uxdw/diff-habits"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
